<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#d9483b">
  <title>Games for you</title>
  <link rel="stylesheet" href="shared/fonts.css">
  <link rel="stylesheet" href="hub.css">
  <script src="shared/nav.js"></script>
</head>
<body>
  <header>
    <div class="awning"><i></i></div>
    <h1>Games <small>for</small> you</h1>
    <p class="hello"><b id="hello">Hello!</b> What shall we play?</p>
  </header>

  <div id="update" hidden>
    <span class="gift">🎁</span>
    <span id="updateText">A new version is ready!</span>
    <button id="updateBtn">Update</button>
  </div>

  <a id="last" class="last" hidden>
    <img alt="">
    <span><small>Keep playing</small><b></b></span>
    <i class="play"></i>
  </a>

  <main id="games"></main>

  <footer>
    <span id="version"></span>
    <button id="check" class="link">Check for updates</button>
  </footer>

  <script src="version.js"></script>
  <script src="games.js"></script>
  <script src="hub.js"></script>
</body>
</html>
