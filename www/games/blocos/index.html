<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2f4aa8">
<title>Blocos da Joana</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="menu" class="screen" hidden>
  <header class="bar">
    <button class="round" id="m-home" aria-label="Home">🏠</button>
    <span></span>
    <button class="round b-set" aria-label="Settings">⚙️</button>
  </header>
  <h1 id="logo"><span>Blocos</span><small>da Joana</small></h1>
  <div id="menu-cats"></div>
  <button class="mode-btn" id="m-classic"><b>Classic</b><small>👑 <span id="m-best">0</span></small></button>
  <button class="mode-btn adv" id="m-adv"><b>Adventures</b><small>⭐ <span id="m-stars">0</span></small></button>
</div>

<div id="map" class="screen" hidden>
  <header class="bar">
    <button class="round" id="map-back" aria-label="Back">↩</button>
    <h2>Adventures</h2>
    <button class="round b-set" aria-label="Settings">⚙️</button>
  </header>
  <nav id="tabs">
    <button data-mode="time">⏱<small>Time Attack</small></button>
    <button data-mode="moves">👣<small>Moves</small></button>
    <button data-mode="relaxed">∞<small>Relaxed</small></button>
  </nav>
  <div id="map-scroll"><div id="map-path"></div></div>
</div>

<div id="app" class="screen">
  <header id="top">
    <button class="round" id="b-home" aria-label="Home">🏠</button>
    <div id="best"><span>👑</span><b id="best-n">0</b></div>
    <div id="chip" hidden></div>
    <button class="round b-set" aria-label="Settings">⚙️</button>
  </header>

  <div id="score">0</div>
  <div id="limit" hidden><span id="limit-t"></span><div id="tbar"><i></i></div></div>
  <div id="combo" hidden></div>

  <div id="boardwrap">
    <div id="board"></div>
    <div id="blast"></div>
  </div>

  <div id="tray">
    <div class="slot" data-i="0"></div>
    <div class="slot" data-i="1"></div>
    <div class="slot" data-i="2"></div>
  </div>

  <footer id="bottom">
    <button id="b-undo" aria-label="Undo"><span>↶</span><small>Undo</small><i id="undo-n">1</i></button>
  </footer>
</div>

<div id="float"></div>
<canvas id="fx"></canvas>
<div id="praise"></div>

<div id="cat" hidden>
  <div id="cat-face"></div>
  <div id="cat-say"></div>
</div>

<div id="over" hidden>
  <div class="box">
    <h2 id="over-title">No more space!</h2>
    <p class="lbl" id="over-lbl">Score</p>
    <p id="over-score">0</p>
    <p class="lbl" id="over-sub">👑 Best <b id="over-best">0</b></p>
    <button class="big" id="b-again">Play again</button>
    <button class="ghostbtn" id="b-over-undo">↶ Undo last move</button>
    <button class="ghostbtn" id="b-over-map" hidden>🗺️ Map</button>
  </div>
</div>

<div id="lvl" class="modal" hidden>
  <div class="box">
    <h2 id="lvl-title">Level 1</h2>
    <p class="lbl" id="lvl-world"></p>
    <div id="lvl-board"></div>
    <div id="diffs">
      <button data-d="1"><b>Easy</b><span class="st"></span></button>
      <button data-d="2"><b>Normal</b><span class="st"></span></button>
      <button data-d="3"><b>Hard</b><span class="st"></span></button>
    </div>
    <p id="lvl-info"></p>
    <button class="big" id="lvl-play">Play</button>
    <button class="ghostbtn" id="lvl-cont" hidden>▶ Continue</button>
    <button class="ghostbtn" id="lvl-close">Close</button>
  </div>
</div>

<div id="win" class="modal" hidden>
  <div class="box">
    <h2 id="win-title">Level complete!</h2>
    <div id="win-stars"><i>★</i><i>★</i><i>★</i></div>
    <p class="lbl" id="win-msg"></p>
    <button class="big" id="win-next">Next level ▶</button>
    <button class="ghostbtn" id="win-retry">Play again</button>
    <button class="ghostbtn" id="win-map">🗺️ Map</button>
  </div>
</div>

<div id="settings" hidden>
  <div class="box">
    <h2>Settings</h2>
    <label><span>🔊 Sounds</span><input type="checkbox" id="s-sfx"></label>
    <label><span>🎵 Music</span><input type="checkbox" id="s-music"></label>
    <label><span>📳 Vibration</span><input type="checkbox" id="s-vib"></label>
    <button class="ghostbtn" id="b-restart">Restart game</button>
    <button class="big" id="b-close">Done</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
