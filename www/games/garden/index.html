<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff6f0">
<title>Flower Garden</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../shared/nav.css">
<script src="../../shared/nav.js"></script>
<script>GFY.back([['#dlg', null], ['#sheet.center', null], ['#sheet', '#sheet [data-close]'], ['#garden', '#g-back']]);</script>
</head>
<body>
<div id="app">
  <header id="hud">
    <button class="gfy-home" aria-label="All games"></button>
    <button id="lvl" aria-label="Level">
      <svg viewBox="0 0 40 40"><circle class="ring-bg" cx="20" cy="20" r="17" /><circle id="xpring" cx="20" cy="20" r="17" /></svg>
      <span id="lvln">1</span>
    </button>
    <button class="pill" id="p-en">⚡<b id="en">100</b><small id="ent"></small></button>
    <button class="pill" id="p-coin">🪙<b id="coins">0</b></button>
    <button class="pill" id="p-star">⭐<b id="stars">0</b></button>
    <button class="pill" id="p-gem">💎<b id="gems">0</b></button>
  </header>

  <section id="orders"></section>

  <div id="boardwrap">
    <div id="tip" hidden></div>
    <div id="board"></div>
  </div>

  <div id="info"></div>

  <nav id="nav">
    <button id="n-store"><span>📦</span><small id="n-store-t">0/4</small></button>
    <button id="n-shop"><span>🛍️</span><small>Shop</small></button>
    <button id="n-garden" class="big"><span>🏡</span><small>Garden</small><i class="badge" id="n-garden-b" hidden>!</i></button>
    <button id="n-daily"><span>🎁</span><small>Daily</small><i class="dot" id="n-daily-d" hidden></i></button>
    <button id="n-set"><span>⚙️</span><small>Settings</small></button>
  </nav>
</div>

<div id="garden" hidden>
  <header class="ghead">
    <button class="round" id="g-back" aria-label="Back">↩</button>
    <h2 id="g-title"></h2>
    <div class="pill">⭐<b id="g-stars">0</b></div>
  </header>
  <div id="g-tabs" class="tabs"></div>
  <div id="g-scene"></div>
  <div id="g-panel"></div>
</div>

<div id="backdrop" hidden></div>
<section id="sheet" class="sheet" hidden></section>

<div id="dlg" hidden>
  <div class="dbox">
    <div id="dlg-face"></div>
    <b id="dlg-name"></b>
    <p id="dlg-text"></p>
    <span class="dnext">▼</span>
  </div>
</div>

<div id="toast" hidden></div>
<div id="fx"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
