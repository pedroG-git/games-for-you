<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f3e6c9">
  <title>Bus</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../../shared/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="../../shared/nav.css">
<link rel="stylesheet" href="../../shared/settings.css">
  <script src="../../shared/nav.js"></script>
<script src="../../shared/settings.js"></script>
  <script>GFY.back([['#map', '#mapBack']]);</script>
</head>
<body>
  <canvas id="c"></canvas>

  <header id="hud">
    <button class="gfy-home" aria-label="All games"></button>
    <div class="pill" id="lvl">Level 1</div>
    <div class="pill small" id="left">0 customers</div>
    <button id="mapBtn" class="round" aria-label="Level map">🗺️</button>
    <button class="gfy-gear" aria-label="Settings"></button>
  </header>

  <footer id="bar">
    <button id="bSlot" class="boost slot"><span class="ico">🅿️</span><span class="lbl">Extra spot</span><span class="badge" id="nSlot">2</span></button>
    <button id="bShuffle" class="boost shuf"><span class="ico">🔀</span><span class="lbl">Shuffle line</span><span class="badge" id="nShuffle">2</span></button>
  </footer>

  <section id="title" class="screen show">
    <div class="sign">
      <div class="awning"></div>
      <h1>Bus</h1>
      <p class="tag">Burgers to go. Customers to move.</p>
    </div>
    <div class="howto">
      Tap a bus to drive it out (follow the arrow).<br>
      Customers hop on buses of their colour.<br>
      Don't let the parking lot fill up!
    </div>
    <button id="play" class="big">Play</button>
    <p class="sub" id="titleLvl"></p>
    <button id="mapLink" class="big alt map" hidden>🗺️ Level map</button>
    <button id="restart" class="link">Start over from level 1</button>
    <button class="gfy-home corner" aria-label="All games"></button>
    <button class="gfy-gear corner" aria-label="Settings"></button>
  </section>

  <section id="win" class="screen">
    <div class="card">
      <h2 id="winT">Level 1 complete!</h2>
      <div class="stars big-stars" id="winStars"></div>
      <div class="bubble"><p id="qText"></p></div>
      <p class="who" id="qWho"></p>
      <p class="ep" id="qEp"></p>
      <button id="next" class="big">Next level</button>
      <button id="winMap" class="link back">🗺️ Level map</button>
    </div>
  </section>

  <section id="map" class="screen">
    <div class="card mapcard">
      <h2>Levels</h2>
      <p class="sub dark" id="mapStars"></p>
      <div id="mapGrid"></div>
      <button id="mapBack" class="big">Back</button>
    </div>
  </section>

  <section id="lose" class="screen">
    <div class="card">
      <h2>Parking lot full!</h2>
      <p class="sub dark">No bus for the next customer.</p>
      <button id="lSlot" class="big alt">🅿️ Use an extra spot (<span>0</span>)</button>
      <button id="lShuffle" class="big alt">🔀 Shuffle the line (<span>0</span>)</button>
      <button id="retry" class="big">Retry level</button>
    </div>
  </section>


  <script src="js/rules.js"></script>
  <script src="js/levelgen.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/puns.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
