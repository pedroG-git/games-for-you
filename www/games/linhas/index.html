<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<title>Linhas</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../shared/nav.css">
<script src="../../shared/nav.js"></script>
<script>GFY.back([['#settings', '#b-close'], ['#over', '#o-menu'], ['#upgrade', null], ['#pause', '#p-close'], ['#frozen', '#f-resume'], ['#mapview', '#mv-back'], ['#game', '#b-back']]);</script>
</head>
<body>
<div id="menu" class="screen">
  <header class="bar">
    <button class="gfy-home" aria-label="All games"></button>
    <span></span>
    <button class="round b-set" aria-label="Settings">⚙️</button>
  </header>
  <h1 id="logo"><span>Linhas</span><small>Connect the city by train</small></h1>
  <button class="mode-btn cont" id="m-cont" hidden><b>▶ Continue</b><small id="m-cont-sub"></small></button>
  <nav id="modes">
    <button data-mode="normal"><b>Normal</b><small>Don't let it overflow</small></button>
    <button data-mode="relaxed"><b>Relaxed</b><small>No game over</small></button>
  </nav>
  <div id="cities"></div>
  <button class="mode-btn daily" id="m-daily"><b>📅 Daily</b><small id="m-daily-sub"></small></button>
</div>

<div id="game" class="screen" hidden>
  <canvas id="cv"></canvas>
  <header id="hud">
    <button class="round" id="b-back" aria-label="Back">↩</button>
    <div id="score"><span>👤</span><b id="score-n">0</b><small id="goal"></small></div>
    <div id="week"><div id="dots"></div><small id="week-n">Week 1</small></div>
    <div id="counts">
      <button class="cnt" id="c-tun" title="Tunnels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15V9a9 7 0 0 1 18 0v6"/><path d="M7 15v-4a5 4 0 0 1 10 0v4"/><path d="M2 20c2-1.5 3-1.5 5 0s3 1.5 5 0 3-1.5 5 0 3 1.5 5 0"/></svg><i>0</i></button>
    </div>
  </header>
  <footer id="bar">
    <div class="row">
      <button class="round" id="b-undo" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button id="b-trash" class="round" hidden aria-label="Remove line">🗑</button>
      <div id="spares">
        <button class="cnt" id="c-trains" title="Spare trains"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10h14"/><circle cx="9" cy="13.5" r=".6" fill="currentColor"/><circle cx="15" cy="13.5" r=".6" fill="currentColor"/><path d="M8 21l2-4M16 21l-2-4"/></svg><i>0</i></button>
        <button class="cnt" id="c-cars" title="Carriages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="11" rx="2.5"/><path d="M6 10h3M11 10h3M16 10h3"/><circle cx="7" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg><i>0</i></button>
        <button class="cnt" id="c-ich" title="Interchanges"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg><i>0</i></button>
      </div>
      <span class="grow"></span>
      <button class="round" id="b-pause" aria-label="Pause">⏸</button>
      <button class="round" id="b-speed" aria-label="Speed">▶</button>
    </div>
    <div id="chips"></div>
  </footer>
  <div id="toast"></div>
  <div id="hint" hidden></div>
  <div id="mapview" hidden>
    <span id="mapview-t"></span>
    <button id="mv-back">Done</button>
  </div>
  <div id="frozen" hidden>
    <span>Paused · you can still change lines</span>
    <button id="f-more" aria-label="Menu">⋯</button>
    <button id="f-resume">Resume</button>
  </div>
</div>

<div id="pause" class="modal" hidden>
  <div class="box">
    <h2>Paused</h2>
    <button class="big" id="p-resume">Resume</button>
    <button class="ghostbtn" id="p-close">Back to the map</button>
    <button class="ghostbtn" id="p-restart">Restart</button>
    <button class="ghostbtn" id="p-end">End game</button>
    <button class="ghostbtn b-set">⚙️ Settings</button>
  </div>
</div>

<div id="upgrade" class="modal" hidden>
  <div class="box">
    <h2 id="up-title">Week 2</h2>
    <p class="lbl" id="up-week"></p>
    <p class="lbl">+1 train to drag onto a line — and choose one:</p>
    <div id="up-opts"></div>
  </div>
</div>

<div id="over" class="modal" hidden>
  <div class="box">
    <h2 id="over-title">Overcrowded!</h2>
    <p class="lbl" id="over-sub">Passengers delivered</p>
    <p id="over-score">0</p>
    <p id="over-stars"></p>
    <div id="over-chart" hidden></div>
    <p class="lbl" id="over-best"></p>
    <p class="lbl" id="over-stats"></p>
    <button class="big" id="o-again">Play again</button>
    <button class="ghostbtn" id="o-map">See your map</button>
    <button class="ghostbtn" id="o-menu">Menu</button>
  </div>
</div>

<div id="settings" class="modal" hidden>
  <div class="box">
    <h2>Settings</h2>
    <label><span>🔊 Sounds</span><input type="checkbox" id="s-sfx"></label>
    <label><span>🎵 Music</span><input type="checkbox" id="s-music"></label>
    <label><span>📳 Vibration</span><input type="checkbox" id="s-vib"></label>
    <label><span>🌙 Night map</span><input type="checkbox" id="s-night"></label>
    <label><span>🎨 Colour-blind lines</span><input type="checkbox" id="s-cb"></label>
    <label><span>⏸ Pause when a station fills up</span><input type="checkbox" id="s-auto"></label>
    <button class="ghostbtn" id="s-hints">Show the tips again</button>
    <button class="big" id="b-close">Done</button>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
