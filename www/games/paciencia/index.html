<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e3d2b">
<title>Paciência</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../shared/nav.css">
<link rel="stylesheet" href="../../shared/settings.css">
<script src="../../shared/nav.js"></script>
<script src="../../shared/settings.js"></script>
<script>GFY.back([['#sheet-new', '#sheet-new [data-close]']]);</script>
</head>
<body>
<canvas id="c"></canvas>

<header id="top">
  <button class="gfy-home" aria-label="Todos os jogos"></button>
  <div class="pill"><span id="time">0:00</span><i></i><span id="moves">0 jogadas</span></div>
  <div class="pill soft" id="label">Normal</div>
  <button class="gfy-gear" id="btn-settings" aria-label="Definições"></button>
</header>

<button id="finish" hidden>Terminar</button>

<footer id="bar">
  <button id="btn-new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg><span>Novo</span></button>
  <button id="btn-hint"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z" /></svg><span>Dica</span></button>
  <button id="btn-undo"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 0 1 0 12" transform="translate(0 -3)" /></svg><span>Desfazer</span></button>
</footer>

<div id="backdrop" hidden></div>

<section class="sheet" id="sheet-new" hidden>
  <h2>Novo jogo</h2>
  <p class="note">Todos os jogos têm solução.</p>
  <div class="grid3">
    <button data-diff="facil">Fácil</button>
    <button data-diff="normal">Normal</button>
    <button data-diff="dificil">Difícil</button>
  </div>
  <button class="wide" id="btn-daily">Jogo do dia</button>
  <button class="wide ghost" id="btn-restart">Recomeçar este jogo</button>
  <button class="wide ghost" data-close>Voltar</button>
</section>

<div id="stats-wrap" hidden>
  <h3>Estatísticas <small id="stats-mode"></small></h3>
  <div class="stats" id="stats"></div>
</div>

<section class="sheet center" id="win" hidden>
  <h2>Boa!</h2>
  <p class="note" id="win-note"></p>
  <div class="stats" id="win-stats"></div>
  <button class="wide" id="btn-again">Novo jogo</button>
</section>

<script type="module" src="js/main.js"></script>
</body>
</html>
