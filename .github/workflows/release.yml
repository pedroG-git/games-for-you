# Builds the signed APK and publishes it as a GitHub Release whenever a version tag (v1.2.3) is pushed.
name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Check tag matches package.json
        run: |
          V=$(node -p "require('./package.json').version")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $V"; exit 1; }
          echo "VERSION=$V" >> "$GITHUB_ENV"
          IFS=. read -r MA MI PA <<< "$V"
          echo "VERSION_CODE=$((MA * 10000 + MI * 100 + PA))" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm test
      - run: npm run sync

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.p12"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.p12"
          cd android
          ./gradlew assembleRelease --no-daemon -PappVersionCode=$VERSION_CODE -PappVersionName=$VERSION
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/joanas-games.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" joanas-games.apk --title "Joana's Games $VERSION" --notes "Download joanas-games.apk on the phone and open it to install or update."
